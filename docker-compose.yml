services:
  postgres:
    image: postgres:16
    container_name: credit-risk-postgres
    environment:
      POSTGRES_USER: risk
      POSTGRES_PASSWORD: risk
      POSTGRES_DB: credit_risk
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U risk -d credit_risk"]
      interval: 5s
      retries: 10
volumes:
  pgdata:
